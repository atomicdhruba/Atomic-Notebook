<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="atomic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="atomic-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0a0c12"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Atom Orbits -->
  <ellipse cx="32" cy="32" rx="22" ry="8.5" stroke="url(#atomic-grad)" stroke-width="2.5" transform="rotate(30 32 32)"/>
  <ellipse cx="32" cy="32" rx="22" ry="8.5" stroke="url(#atomic-grad)" stroke-width="2.5" transform="rotate(90 32 32)"/>
  <ellipse cx="32" cy="32" rx="22" ry="8.5" stroke="url(#atomic-grad)" stroke-width="2.5" transform="rotate(150 32 32)"/>

  <!-- Nucleus -->
  <circle cx="32" cy="32" r="10" fill="url(#atomic-glow)"/>
  <circle cx="32" cy="32" r="4.5" fill="#60a5fa"/>
</svg>
